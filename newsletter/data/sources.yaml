# 뉴스레터 정보 소스 목록 (자동화 대비)
# - priority: 1 = 필수, 2 = 확장 후보
# - method: crawl | api | rss | search | watch(페이지 변경 감지) | manual
# - verified: 실제 접속 확인 날짜 (미확인 시 null)
# 사람이 읽는 설명은 ../02-sources.md 참고

venues:
  - id: coex
    name: 코엑스
    region: 서울 강남
    url: https://www.coex.co.kr
    calendar_url: https://www.coex.co.kr/event/full-schedules/
    method: crawl
    format: html_list
    note: 브라우저 User-Agent 없으면 403
    priority: 1
    verified: 2026-10-14

  - id: coex_magok
    name: 코엑스마곡
    region: 서울 강서
    url: https://coexmagok.co.kr
    calendar_url: https://coexmagok.co.kr/event-schedule/calendar/
    method: crawl
    format: html_calendar
    note: 목록형 /event-schedule/list/ 도 있음
    priority: 1
    verified: 2026-10-14

  - id: kintex
    name: 킨텍스
    region: 경기 고양
    url: https://www.kintex.com
    calendar_url: https://www.kintex.com/web/ko/event/clist.do?searchType=11
    api_url: https://www.kintex.com/web/ko/event/calendarEventList.do?yearMonth={YYYYMM}&searchType=11
    method: api
    format: json_daily
    note: 날짜별로 묶인 JSON, 홀 정보 없음
    priority: 1
    verified: 2026-10-14

  - id: bexco
    name: 벡스코
    region: 부산
    url: https://www.bexco.co.kr
    calendar_url: https://www.bexco.co.kr/kor/CMS/EventScheduleMgr/list.do?mCode=MN214
    method: crawl
    format: html_list
    note: 소규모 회의 다수 포함 → 분류 필터 필요, listExcel.do 엑셀 다운로드 있음
    priority: 1
    verified: 2026-10-14

  - id: setec
    name: SETEC
    region: 서울 대치
    url: https://www.setec.or.kr
    calendar_url: https://www.setec.or.kr/front/schedule/list.do
    method: crawl
    format: html_list
    note: 같은 행사 중복 등록 있음 → 중복 제거
    priority: 1
    verified: 2026-10-14

  - id: at_center
    name: 양재 aT센터
    region: 서울 양재
    url: null               # 주소 확인 필요
    calendar_url: null
    method: crawl
    priority: 1
    verified: null

  # --- 확장 후보 ---
  - { id: ueco, name: 울산전시컨벤션센터, region: 울산, method: crawl, priority: 2, note: 자사 지정협력 venue, verified: null }
  - { id: songdo_convensia, name: 송도컨벤시아, region: 인천, method: crawl, priority: 2, verified: null }
  - { id: suwon_cc, name: 수원컨벤션센터, region: 경기 수원, method: crawl, priority: 2, verified: null }
  - { id: dcc, name: 대전컨벤션센터, region: 대전, method: crawl, priority: 2, verified: null }
  - { id: exco, name: EXCO, region: 대구, method: crawl, priority: 2, verified: null }
  - { id: kdj_center, name: 김대중컨벤션센터, region: 광주, method: crawl, priority: 2, verified: null }
  - { id: ceco, name: 창원컨벤션센터, region: 경남 창원, method: crawl, priority: 2, verified: null }
  - { id: hico, name: 경주화백컨벤션센터, region: 경북 경주, method: crawl, priority: 2, verified: null }
  - { id: icc_jeju, name: ICC JEJU, region: 제주, method: crawl, priority: 2, verified: null }

aggregators:
  - { id: akei, name: 한국전시산업진흥회 전시 포털, method: crawl, note: venue 누락분 교차 확인, verified: null }
  - { id: data_go_kr, name: 공공데이터포털, url: https://www.data.go.kr, method: api, note: 전시·행사 Open API 존재 여부 확인, verified: null }
  - { id: korea_mice_bureau, name: 한국관광공사 코리아MICE뷰로, method: crawl, note: 국제회의 일정, verified: null }

news:
  keywords:
    - MICE
    - 전시컨벤션
    - 컨벤션센터
    - 국제회의 유치
    - 전시회 개최
